<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Framework + ACA Sandbox</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #0f172a; color: #e2e8f0;
    }
    header {
      padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .session { font-size: 12px; color: #94a3b8; margin-left: auto; }
    button {
      background: #334155; color: #e2e8f0; border: 1px solid #475569;
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #475569; }
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .meta { font-size: 11px; color: #94a3b8; align-self: center; }
    form { display: flex; gap: 8px; padding: 16px 20px; background: #1e293b; border-top: 1px solid #334155; }
    input[type=text] {
      flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 14px;
    }
    input[type=submit] { background: #2563eb; border-color: #2563eb; color: #fff; padding: 10px 18px; }
  </style>
</head>
<body>
  <header>
    <h1>Agent Framework · ACA Sandbox session isolation</h1>
    <button id="reset" type="button">New session</button>
    <span class="session" id="sessionLabel"></span>
  </header>
  <div id="log">
    <div class="meta">Each session runs in its own isolated sandbox. Try: "Compute the 50th Fibonacci number" or "Create a CSV and show its contents."</div>
  </div>
  <form id="form">
    <input type="text" id="input" placeholder="Ask the agent to run some code…" autocomplete="off" />
    <input type="submit" value="Send" />
  </form>

  <script>
    let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
    localStorage.setItem("sessionId", sessionId);
    document.getElementById("sessionLabel").textContent = "session: " + sessionId.slice(0, 8);

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      add(message, "user");
      const pending = add("…", "assistant");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: sessionId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");
        sessionId = data.session_id;
        localStorage.setItem("sessionId", sessionId);
        pending.textContent = data.reply;
      } catch (err) {
        pending.textContent = "Error: " + err.message;
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      await fetch(`/api/sessions/${sessionId}/reset`, { method: "POST" });
      sessionId = crypto.randomUUID();
      localStorage.setItem("sessionId", sessionId);
      document.getElementById("sessionLabel").textContent = "session: " + sessionId.slice(0, 8);
      log.innerHTML = '<div class="meta">New isolated session started.</div>';
    });
  </script>
</body>
</html>
